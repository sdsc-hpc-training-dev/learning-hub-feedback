name: Feature request
description: Suggest a technical improvement or new capability.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: This report is public. Do not include credentials, personal data, or confidential information.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to accomplish and what is missing.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples or alternatives (optional)
      description: Screenshots are welcome after removing sensitive information.
