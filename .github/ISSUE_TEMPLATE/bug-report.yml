name: Bug report
description: Report a reproducible technical problem in the Learning Hub.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: "This report and all attachments are public. Do not include credentials, personal data, or confidential information. Report security concerns privately through the SDSC contact page, not here."
  - type: input
    id: page
    attributes:
      label: Affected page
      description: A public Learning Hub page URL, with any private query parameters removed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the page...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device (optional)
      placeholder: Chrome on Windows, Firefox on macOS, Safari on iPhone, etc.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or additional details (optional)
      description: Remove names, tokens, credentials, and other sensitive details before attaching files.
